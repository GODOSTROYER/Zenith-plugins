name: Sync v2 generated packages
on:
  push:
    branches: [feat/reviewed-operations-and-publishing]
permissions:
  contents: write
jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: feat/reviewed-operations-and-publishing
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Commit generated packages when source changed them
        shell: bash
        run: |
          if git diff --quiet -- plugins packages/client/dist packages/control/dist .agents .claude-plugin; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add plugins packages/client/dist packages/control/dist .agents .claude-plugin
          git commit -m 'chore: sync generated v2 packages'
          git push origin HEAD:feat/reviewed-operations-and-publishing
