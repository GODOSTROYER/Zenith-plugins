name: Verify development packages
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - name: Preserve verified development workspace for review
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-development-workspace-${{ github.sha }}
          retention-days: 3
          include-hidden-files: true
          path: |
            packages/
            plugins/
            shared/
            scripts/
            tests/
            docs/
            package.json
            package-lock.json
            tsconfig.json
            tsconfig.control.json
            contracts/
            CHANGELOG.md
            README.md
            AGENTS.md
            CLAUDE.md
            PROGRESS.md
            .agents/
            .claude-plugin/
            .gitattributes
            .gitignore
            .github/workflows/verify.yml
      - name: Check reproducible package output
        run: git diff --exit-code -- plugins packages/client/dist packages/control/dist .agents .claude-plugin
