name: Verify development packages
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - name: Preserve verified development workspace for review
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: verified-development-workspace-${{ github.sha }}
          retention-days: 3
          include-hidden-files: true
          path: |
            packages/
            plugins/
            shared/
            scripts/
            tests/
            docs/
            package.json
            package-lock.json
            tsconfig.json
            README.md
            AGENTS.md
            CLAUDE.md
            PROGRESS.md
            .agents/
            .claude-plugin/
            .gitattributes
            .gitignore
            .github/workflows/verify.yml
      - name: Check reproducible package output
        run: git diff --exit-code -- plugins packages/client/dist .agents .claude-plugin
