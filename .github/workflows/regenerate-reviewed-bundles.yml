name: Synchronize reviewed feature-branch bundles
# Temporary assembly workflow. Removed before PR handoff. Never runs on main or a PR event.
on:
  push:
    branches: [feat/reviewed-operations-and-publishing]
    paths:
      - .github/workflows/regenerate-reviewed-bundles.yml
      - packages/control/*.ts
      - tests/control-vault.test.mjs
permissions:
  contents: read
jobs:
  windows-vault:
    if: github.repository == 'GODOSTROYER/Zenith-plugins'
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --import tsx --test tests/control-vault.test.mjs
  synchronize:
    needs: windows-vault
    if: github.repository == 'GODOSTROYER/Zenith-plugins' && github.ref == 'refs/heads/feat/reviewed-operations-and-publishing'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run verify
      - name: Commit only generated bundles to the requested PR branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- packages/client/dist packages/control/dist plugins .agents .claude-plugin
          if git diff --cached --quiet; then exit 0; fi
          git diff --cached --name-only | while read -r file; do
            case "$file" in
              packages/client/dist/*|packages/control/dist/*|plugins/*|.agents/*|.claude-plugin/*) ;;
              *) echo 'Refusing an unexpected generated path'; exit 1 ;;
            esac
          done
          git commit -m 'build: synchronize verified standalone and native plugin bundles'
          header=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$header"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $header" push origin HEAD:refs/heads/feat/reviewed-operations-and-publishing
